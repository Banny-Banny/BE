name: railway-db-migrate

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Seed base schema if missing
        shell: bash
        run: |
          if [ -f schema.sql ]; then
            if [ -z "$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='users';")" ]; then
              echo "Applying base schema from schema.sql"
              psql "$DATABASE_URL" -f schema.sql
            else
              echo "Base schema already exists"
            fi
          else
            echo "No schema.sql file found, skipping base schema load"
          fi
      - name: Run TypeORM migrations (Railway direct)
        run: npm run migration:run
